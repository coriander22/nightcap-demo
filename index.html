<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>深夜酒馆 · NIGHTCAP × MBTI 调酒吧</title>
  <meta name="description" content="把一周的协作与压力蒸馏成一杯：焦虑图谱选基酒，IM 风格配辅料与冰，3D 酒柜倒出今晚特调。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/bar.css" />
  <link rel="stylesheet" href="./css/nightcap.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="liquid-overlay"></div>

  <div id="ui">
    <header class="topbar">
      <button class="brand" id="brand" type="button">
        <span class="en">Nightcap Bar</span>
        <span class="zh">深夜酒馆 · 人格特调</span>
      </button>
      <div class="actions">
        <button class="ghost" id="mute" type="button" aria-pressed="false">声音开</button>
        <button class="ghost" id="quiz-btn" type="button">测一测我是哪杯</button>
        <button class="ghost" id="surprise" type="button">随机一杯</button>
      </div>
    </header>

    <div id="hover-tag"></div>
    <div id="toast"><span class="t-kick"></span><strong class="t-main"></strong></div>
    <aside id="sheet" aria-live="polite"></aside>
    <section id="quiz" aria-live="polite"></section>
    <div id="caption" class="caption" hidden>
      <span id="cap-type"></span>
      <strong id="cap-name"></strong>
    </div>
    <div id="inspect" class="inspect" hidden>
      <p>拖动画面，转着看这杯</p>
      <div class="inspect-actions">
        <button type="button" id="shot">保存截图</button>
        <button type="button" id="again">再调一杯</button>
      </div>
    </div>
    <footer class="rail-wrap">
      <div class="rail-meta">
        <span>16 杯特调</span>
        <span>点瓶子，或先测人格</span>
      </div>
      <p class="credit">BGM: Jazz Bar Late Night · Morry / Suno</p>
    </footer>
  </div>

  <div class="nc-overlay" id="nc1" hidden></div>
  <div class="nc-overlay" id="nc2" hidden></div>
  <div class="nc-overlay nc-side" id="nc3" hidden></div>

  <section id="door">
    <div class="mark">NIGHTCAP · 今晚特调</div>
    <div class="nc-door-mid">
      <div class="nc-sign">
        <span class="zh">深夜酒馆</span>
        <span class="en">CYBER TAVERN · 专治周日焦虑</span>
      </div>
      <p class="nc-lead">推门而入 · 把未完成寄存在吧台</p>
      <div class="nc-acts">
        <div><i>I</i><b>基 酒</b><s>看焦虑图谱 · 按烈度选一支</s></div>
        <div><i>II</i><b>冰 块</b><s>IM 风格扫描 · 拖冰摇匀</s></div>
        <div><i>III</i><b>尾 调</b><s>专属特调 · 与明天的第一步</s></div>
      </div>
      <button class="enter" id="enter" type="button">推门而入</button>
    </div>
    <div class="hours">16 型酒架 · 钉钉协作数据蒸馏</div>
  </section>

  <div class="grain" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script type="module" src="./js/main.js?v=audio1"></script>
</body>
</html>
